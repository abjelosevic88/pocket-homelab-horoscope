# Pocket Horoscope — your birth chart, your day and the Moon (Go + SQLite). One container, one volume.
services:
  pocket-horoscope:
    image: ghcr.io/abjelosevic88/pocket-homelab-horoscope:latest
    container_name: pocket-horoscope
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The owner's own connections; everything can also be set under Settings.
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Place search when adding a birth place ("off" = coordinates by hand):
      # GEOCODER_URL: https://geocoding-api.open-meteo.com/v1/search
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
